name: Zostavenie APK

on:
  push:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Príprava podpisového kľúča (ak je nastavený v Secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.SKENER_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "SKENER_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "Používam súkromný podpisový kľúč."
          else
            echo "::warning::Secret SKENER_KEYSTORE_BASE64 nie je nastavený, APK je podpísaný vývojovým kľúčom z repozitára."
          fi

      - name: Testy a zostavenie
        env:
          SKENER_KEYSTORE_PASSWORD: ${{ secrets.SKENER_KEYSTORE_PASSWORD }}
          SKENER_KEY_ALIAS: ${{ secrets.SKENER_KEY_ALIAS }}
          SKENER_KEY_PASSWORD: ${{ secrets.SKENER_KEY_PASSWORD }}
        run: ./gradlew --no-daemon testReleaseUnitTest assembleRelease

      - name: Premenovanie APK
        run: cp app/build/outputs/apk/release/app-release.apk "Skener-0.1.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v5
        with:
          name: Skener-0.1.${{ github.run_number }}
          path: Skener-0.1.${{ github.run_number }}.apk
          retention-days: 30
