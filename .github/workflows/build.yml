name: Zostavenie APK

on:
  push:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Jazykové modely OCR (tessdata_best, slovenčina a angličtina)
        run: |
          mkdir -p app/src/main/assets/tessdata
          for l in slk eng; do
            curl -fsSL -o app/src/main/assets/tessdata/$l.traineddata \
              "https://raw.githubusercontent.com/tesseract-ocr/tessdata_best/main/$l.traineddata"
          done
          ls -la app/src/main/assets/tessdata

      - name: Príprava podpisového kľúča (ak je nastavený v Secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.SKENER_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "SKENER_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "Používam súkromný podpisový kľúč."
          else
            echo "::warning::Secret SKENER_KEYSTORE_BASE64 nie je nastavený, APK je podpísaný vývojovým kľúčom z repozitára."
          fi

      - name: Testy a zostavenie
        env:
          SKENER_KEYSTORE_PASSWORD: ${{ secrets.SKENER_KEYSTORE_PASSWORD }}
          SKENER_KEY_ALIAS: ${{ secrets.SKENER_KEY_ALIAS }}
          SKENER_KEY_PASSWORD: ${{ secrets.SKENER_KEY_PASSWORD }}
        run: ./gradlew --no-daemon testReleaseUnitTest assembleRelease

      - name: Premenovanie APK
        run: cp app/build/outputs/apk/release/app-release.apk "Skener-0.1.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v5
        with:
          name: Skener-0.1.${{ github.run_number }}
          path: Skener-0.1.${{ github.run_number }}.apk
          retention-days: 30

      - name: Zverejnenie APK ako vydanie „najnovsie“
        if: github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="Skener-0.1.${{ github.run_number }}.apk"
          gh release delete najnovsie --yes --cleanup-tag || true
          gh release create najnovsie "$APK" \
            --target "${{ github.sha }}" \
            --prerelease \
            --title "Skener 0.1.${{ github.run_number }}" \
            --notes "Automatické zostavenie z commitu ${{ github.sha }}."
