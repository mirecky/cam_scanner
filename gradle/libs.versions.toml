coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
opencv = { group = "org.opencv", name = "opencv", version.ref = "opencv" }
telephoto-coil3 = { group = "me.saket.telephoto", name = "zoomable-image-coil3", version.ref = "telephoto" }
reorderable = { group = "sh.calvin.reorderable", name = "reorderable", version.ref = "reorderable" }
pdfbox-android = { group = "com.tom-roush", name = "pdfbox-android", version.ref = "pdfbox" }
tesseract = { group = "com.github.adaptech-cz", name = "Tesseract4Android", version.ref = "tesseract" }
